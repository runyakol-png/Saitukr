<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoSRS — головна</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="page">
  <div class="canvas" style="--base:1226px">

    <img src="home.jpg" alt="AutoSRS — головна">

    <a class="hotspot" href="index.html" aria-label="Головна"
       style="left:26.3%;top:1.3%;width:6.5%;height:4.4%"></a>

    <a class="hotspot" href="about.html" aria-label="Про нас"
       style="left:33%;top:1.3%;width:6.7%;height:4.4%"></a>

    <a class="hotspot" href="branches.html" aria-label="Філії"
       style="left:55%;top:1.3%;width:5.2%;height:4.4%"></a>

    <a class="hotspot" href="tel:+380635799065" aria-label="Телефон"
       style="left:67%;top:1%;width:14%;height:5%"></a>

    <button class="hotspot" onclick="openBranch('lviv')"
            style="left:22%;top:33.5%;width:10%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('kyiv')"
            style="left:45%;top:31.5%;width:10%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('kharkiv')"
            style="left:70%;top:36.8%;width:12%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('dnipro')"
            style="left:64%;top:46%;width:12%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('mykolaiv')"
            style="left:51%;top:54%;width:14%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('odesa')"
            style="left:46%;top:58%;width:11%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('izmail')"
            style="left:38%;top:63%;width:12%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('batumi')"
            style="left:7%;top:62%;width:13%;height:8%"></button>

    <button class="hotspot" onclick="openBranch('tbilisi')"
            style="left:18%;top:62%;width:13%;height:8%"></button>

  </div>
</div>

<!-- Окно филиалов -->
<div id="modalBackdrop"
     class="modal-backdrop"
     onclick="if(event.target===this)closeBranch()">
  <div id="modalBody" class="modal"></div>
</div>

<!-- Всплывающее окно менеджера -->
<div id="managerBackdrop"
     class="manager-backdrop"
     onclick="if(event.target===this)closeManager()">

  <div class="manager-popup">

    <button class="manager-close" onclick="closeManager()">×</button>

    <div id="managerFormContent">

      <h2>Зв’язатися з менеджером</h2>

      <p class="manager-text">
        Залиште свої контакти — ми передамо заявку менеджеру вашого регіону.
      </p>

      <form id="managerForm">

        <input
          id="managerName"
          class="manager-input"
          type="text"
          placeholder="Ваше ім’я"
          required
        >

        <input
          id="managerPhone"
          class="manager-input"
          type="tel"
          placeholder="+380"
          required
        >

        <select
          id="managerRegion"
          class="manager-input"
          required
        >
          <option value="">Оберіть область</option>
          <option>Вінницька область</option>
          <option>Волинська область</option>
          <option>Дніпропетровська область</option>
          <option>Донецька область</option>
          <option>Житомирська область</option>
          <option>Закарпатська область</option>
          <option>Запорізька область</option>
          <option>Івано-Франківська область</option>
          <option>Київська область</option>
          <option>Кіровоградська область</option>
          <option>Луганська область</option>
          <option>Львівська область</option>
          <option>Миколаївська область</option>
          <option>Одеська область</option>
          <option>Полтавська область</option>
          <option>Рівненська область</option>
          <option>Сумська область</option>
          <option>Тернопільська область</option>
          <option>Харківська область</option>
          <option>Херсонська область</option>
          <option>Хмельницька область</option>
          <option>Черкаська область</option>
          <option>Чернівецька область</option>
          <option>Чернігівська область</option>
          <option>м. Київ</option>
        </select>

        <button
          id="managerSubmit"
          class="manager-submit"
          type="submit"
        >
          ЗВ’ЯЗАТИСЯ З МЕНЕДЖЕРОМ
        </button>

      </form>
    </div>

    <div id="managerSuccess" class="manager-success">
      <h2>Заявку передано</h2>

      <p>
        Менеджер AutoSRS отримав ваш контакт і зв’яжеться з вами найближчим часом.
      </p>

      <button
        class="manager-submit"
        onclick="closeManager()"
      >
        ГОТОВО
      </button>
    </div>

  </div>
</div>

<script src="app.js"></script>

</body>
</html>
