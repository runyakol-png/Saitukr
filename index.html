<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoSRS — головна</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:white;font-family:Arial,Helvetica,sans-serif}
.wrap{display:flex;justify-content:center;background:#000;min-height:100vh}
.stage{position:relative;width:min(100vw,var(--w));line-height:0}
.stage img{display:block;width:100%;height:auto}
.hit{position:absolute;z-index:5;background:transparent;border:0;cursor:pointer}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
.box{position:relative;width:min(520px,95vw);background:#0b0d0f;border:1px solid #333;border-radius:18px;padding:24px;line-height:1.4;box-shadow:0 0 35px rgba(255,0,20,.18)}
.box h2{margin:0 0 10px;font-size:28px;font-style:italic}.box p{color:#ddd;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions a{padding:12px 15px;border-radius:8px;border:1px solid #555;color:#fff;text-decoration:none;font-weight:700}
.actions .primary{background:#ff1626;border-color:#ff1626}.x{position:absolute;right:12px;top:10px;background:#1a1d21;color:#fff;border:1px solid #333;border-radius:7px;font-size:20px}
</style></head><body>
